name: CI

# Gates `main`, which is what makes a fast-forward promote to `production` safe:
# production can only ever point at a commit that passed these checks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Lint and typecheck need Electron's type definitions, not its binary, and
      # the binary is a ~100 MB download. Skip it.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # House style, enforced rather than remembered: see README > Conventions.
      - name: Prose
        run: npm run lint:prose

      - name: Test
        run: npm test
